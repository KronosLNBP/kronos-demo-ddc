# Publica el demo en el hosting Apache de kronosmedicine.com.mx por FTP
# cada vez que se sube un cambio a la rama main.
#
# Configurar una vez en GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER     servidor FTP del hosting (ej. ftp.kronosmedicine.com.mx)
#   FTP_USERNAME   usuario FTP
#   FTP_PASSWORD   contraseña FTP
#   FTP_DIR        carpeta destino, con / al final (ej. /public_html/demo/)
#   FTP_PROTOCOL   (opcional) ftps, ftp o ftps-legacy. Por defecto ftps.
#   FTP_PORT       (opcional) puerto. Por defecto 21 (usa 990 con ftps-legacy).
#   FTP_SECURITY   (opcional) strict o loose. loose cifra igual, pero acepta certificados
#                  a nombre del servidor del hosting (común en hosting compartido).
# Mientras no existan, el workflow se salta la publicación sin fallar.

name: Publicar demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON de contenido
        run: for f in content/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done

      - name: Validar sintaxis PHP
        run: for f in php/*.php; do php -l "$f" || exit 1; done

      - name: Verificar que no se suban contraseñas
        run: |
          if [ -f php/config.php ]; then echo "::error::php/config.php no debe estar en el repositorio"; exit 1; fi

      - name: Aviso si falta configurar FTP
        if: env.FTP_SERVER == ''
        run: echo "::notice::Faltan los secretos FTP; no se publicó. Ver instrucciones en deploy.yml."

      - name: Diagnóstico de conexión FTP
        if: env.FTP_SERVER != ''
        continue-on-error: true
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ secrets.FTP_PORT || 21 }}
        run: |
          echo "== 1) ¿Responde el puerto $PORT? =="
          timeout 15 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/$PORT && head -c 200 <&3" && echo "OK: el servidor responde" || echo "FALLA: no hay conexión (firewall del hosting o servidor incorrecto)"
          echo "== 2) Inicio de sesión con FTPS explícito (TLS) =="
          curl -sS --max-time 30 --ssl-reqd --insecure --user "$U:$P" "ftp://$FTP_SERVER:$PORT/" --list-only -o /dev/null && echo "OK: FTPS funciona" || echo "FALLA con FTPS"
          echo "== 3) Inicio de sesión con FTP sin cifrar =="
          curl -sS --max-time 30 --user "$U:$P" "ftp://$FTP_SERVER:$PORT/" --list-only -o /dev/null && echo "OK: FTP funciona" || echo "FALLA con FTP"
          echo "== IP de este servidor de GitHub (por si el hosting la bloquea) =="
          curl -s --max-time 10 https://api.ipify.org || true; echo

      - name: Subir por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          security: ${{ secrets.FTP_SECURITY || 'strict' }}
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            functions/**
            firestore.rules
            **/README.md
            php/config.example.php
            .nojekyll
            **/.gitkeep
