<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Shorts | Aprendizaje rápido</title>
    <link rel="icon" href="assets/img/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ocultar barra de scroll para un look de app nativa */
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white font-sans overflow-hidden h-screen w-full relative hidden" id="app-body">

    <!-- Navbar superior flotante y transparente -->
    <nav class="absolute top-0 w-full p-6 flex justify-between items-center z-50 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide shadow-black drop-shadow-md">Kronos<span class="text-blue-500">Shorts</span></h1>
        
        <!-- Botón de regreso visible en PC y Móvil -->
        <button onclick="window.location.href='catalogo.html'" class="pointer-events-auto bg-black/50 backdrop-blur-md p-2 md:px-4 md:py-2 rounded-full text-white hover:bg-slate-800 transition flex items-center shadow-lg border border-slate-700">
            <svg class="w-6 h-6 md:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            <span class="hidden md:inline font-semibold text-sm">Cerrar Shorts</span>
        </button>
    </nav>

    <!-- Contenedor Principal con Scroll Magnético (Snap) -->
    <main id="shorts-container" class="h-screen w-full overflow-y-scroll snap-y snap-mandatory hide-scroll pb-16 md:pb-0">
        
        <!-- Pantalla de carga mientras lee la base de datos -->
        <div class="flex flex-col items-center justify-center h-full w-full bg-slate-950">
            <div class="w-12 h-12 border-4 border-slate-700 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 font-medium animate-pulse">Cargando Shorts...</p>
        </div>

    </main>

    <!-- Menú Inferior (Estilo App Nativa) - Solo visible en móviles -->
    <div class="md:hidden fixed bottom-0 w-full bg-black/95 backdrop-blur-xl border-t border-slate-800 flex justify-around items-center pb-safe pt-3 px-2 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
        <a href="catalogo.html" class="flex flex-col items-center p-2 text-slate-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="text-[10px] font-medium">Catálogo</span>
        </a>
        <a href="shorts.html" class="flex flex-col items-center p-2 text-blue-500">
            <svg class="w-6 h-6 mb-1 drop-shadow-[0_0_8px_rgba(59,130,246,0.5)]" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
            <span class="text-[10px] font-bold">Shorts</span>
        </a>
        <a href="curso.html?id=ddc#flashcards" class="flex flex-col items-center p-2 text-slate-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="text-[10px] font-medium">Flash cards</span>
        </a>
        <a href="app.html" class="flex flex-col items-center p-2 text-slate-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-medium">Mi Perfil</span>
        </a>
    </div>

    <!-- LÓGICA DE FIREBASE Y SHORTS -->
    <script type="module">
        import { db, requireUser } from "./assets/js/firebase.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const container = document.getElementById('shorts-container');

        // 1. Conectar a Firestore y construir la interfaz con los videos reales
        async function cargarShorts() {
            try {
                // Hacemos la consulta a la colección 'shorts' que acabas de inyectar
                const querySnapshot = await getDocs(collection(db, "shorts"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full w-full bg-slate-900 text-center px-6">
                            <svg class="w-16 h-16 text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <h2 class="text-xl font-bold text-white mb-2">Aún no hay Shorts</h2>
                            <p class="text-slate-400">Pronto subiremos contenido rápido de repaso.</p>
                        </div>`;
                    return;
                }

                let htmlContent = "";
                
                querySnapshot.forEach((documento) => {
                    const short = documento.data();
                    
                    htmlContent += `
                        <div class="short-wrapper relative h-screen w-full snap-start snap-always bg-slate-950 flex justify-center items-center overflow-hidden">
                            
                            <!-- Reproductor Nativo apuntando a tu Apache -->
                            <video class="short-video w-full h-full object-cover cursor-pointer" loop playsinline muted>
                                <source src="${esc(short.videoUrl)}" type="video/mp4">
                            </video>
                            
                            <!-- Sombra inferior para que las letras se lean bien sobre el video -->
                            <div class="absolute bottom-0 w-full h-[60%] bg-gradient-to-t from-black via-black/60 to-transparent pointer-events-none"></div>

                            <!-- Textos del video (Inyectados desde la BD) -->
                            <div class="absolute bottom-24 md:bottom-12 left-4 md:left-8 z-10 max-w-[75%] md:max-w-[50%] pointer-events-none">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded mb-3 inline-block shadow-md uppercase tracking-wider">${esc(short.categoria || 'Medicina')}</span>
                                <h2 class="text-xl md:text-3xl font-bold text-white mb-2 shadow-black drop-shadow-lg">${esc(short.titulo)}</h2>
                                <p class="text-sm md:text-base text-slate-300 shadow-black drop-shadow-md line-clamp-2 md:line-clamp-none">${esc(short.descripcion)}</p>
                            </div>

                            <!-- Botones laterales (Me gusta, Compartir) -->
                            <div class="absolute bottom-28 md:bottom-16 right-4 md:right-8 flex flex-col items-center space-y-6 z-10">
                                <button class="flex flex-col items-center text-white hover:text-red-500 transition btn-like focus:outline-none transform active:scale-90">
                                    <div class="bg-slate-800/60 backdrop-blur-md p-3 md:p-4 rounded-full mb-1 border border-slate-700/50 shadow-lg">
                                        <svg class="w-7 h-7 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                    </div>
                                    <span class="text-[10px] md:text-xs font-bold drop-shadow-md">Me Gusta</span>
                                </button>
                                
                                <button onclick="navigator.clipboard.writeText(window.location.href); this.querySelector('span').textContent='¡Copiado!';" class="flex flex-col items-center text-white hover:text-blue-400 transition focus:outline-none transform active:scale-90">
                                    <div class="bg-slate-800/60 backdrop-blur-md p-3 md:p-4 rounded-full mb-1 border border-slate-700/50 shadow-lg">
                                        <svg class="w-7 h-7 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                    </div>
                                    <span class="text-[10px] md:text-xs font-bold drop-shadow-md">Compartir</span>
                                </button>
                            </div>

                            <!-- Icono de Play gigante que aparece al pausar -->
                            <div class="play-icon absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                                <div class="bg-black/40 backdrop-blur-sm rounded-full p-4">
                                    <svg class="w-16 h-16 md:w-24 md:h-24 text-white/90 ml-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                // Inyectar el HTML construido
                container.innerHTML = htmlContent;
                
                // Activar el motor del reproductor (scroll y clicks)
                activarReproductorMagico();

            } catch (error) {
                console.error("Error al obtener los shorts de Firebase:", error);
                container.innerHTML = `<div class="flex items-center justify-center h-full text-red-500 font-bold px-6 text-center">Error al conectar con el servidor. Revisa tu conexión.</div>`;
            }
        }

        // 2. Motor del reproductor: Intersection Observer y Control Táctil
        function activarReproductorMagico() {
            
            // Pausar/Reproducir al tocar la pantalla
            const videos = document.querySelectorAll('.short-video');
            videos.forEach(video => {
                video.addEventListener('click', () => {
                    const playIcon = video.parentElement.querySelector('.play-icon');
                    if (video.paused) {
                        video.play();
                        playIcon.style.opacity = '0';
                    } else {
                        video.pause();
                        playIcon.style.opacity = '1';
                    }
                });
            });

            // Reproducir automáticamente el video que está en el centro de la pantalla
            const observerOptions = {
                root: container,
                threshold: 0.7 // El video debe cubrir el 70% de la pantalla para activarse
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const playIcon = entry.target.querySelector('.play-icon');
                    
                    if (entry.isIntersecting) {
                        video.muted = false; 
                        video.play().catch(e => {
                            video.muted = true;
                            video.play();
                        });
                        playIcon.style.opacity = '0';
                    } else {
                        video.pause();
                        video.currentTime = 0; // Regresa el video a 0 al pasar al siguiente
                    }
                });
            }, observerOptions);

            // Asignar el observador a cada "tarjeta" de video
            document.querySelectorAll('.short-wrapper').forEach(wrapper => {
                observer.observe(wrapper);
            });

            // Lógica visual básica del botón "Me gusta" (Corazón rojo)
            document.querySelectorAll('.btn-like').forEach(btn => {
                btn.addEventListener('click', function() {
                    const icon = this.querySelector('svg');
                    icon.classList.toggle('fill-red-500');
                    icon.classList.toggle('text-red-500');
                });
            });
        }

        // 3. Solo usuarios con sesión
        requireUser(() => cargarShorts());
    </script>
</body>
</html>
