<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | kronosMedicine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-gray-800 rounded-lg shadow-xl border border-gray-700 p-8">
        <div class="text-center mb-8">
            <span class="text-3xl font-bold tracking-tight text-blue-500">kronos<span class="text-white">Medicine</span></span>
            <h2 class="text-xl text-gray-300 mt-2">Crea tu cuenta</h2>
        </div>

        <form id="formRegistro" class="space-y-6">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-400 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-400 mb-1">Correo Electrónico</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-400 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div id="mensajeAlerta" class="hidden p-3 rounded text-sm text-center font-medium"></div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300">
                Registrarse
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-400 mt-6">
            ¿Ya tienes cuenta? <a href="login.html" class="text-blue-400 hover:text-blue-300">Inicia sesión</a>
        </p>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const alerta = document.getElementById('mensajeAlerta');
            
            try {
                const response = await fetch('procesar_registro.php', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                alerta.classList.remove('hidden', 'bg-red-900', 'text-red-200', 'bg-green-900', 'text-green-200');
                
                if(data.success) {
                    alerta.classList.add('bg-green-900', 'text-green-200');
                    alerta.textContent = data.message;
                    this.reset();
                    // setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    alerta.classList.add('bg-red-900', 'text-red-200');
                    alerta.textContent = data.message;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
