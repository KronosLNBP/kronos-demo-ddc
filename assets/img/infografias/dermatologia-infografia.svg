<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2442" width="1080" height="2442" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient></defs>
<rect width="1080" height="2442" fill="#0b1020"/>
<rect width="1080" height="200" fill="url(#hdr)"/>
<text x="50" y="62" font-size="20" font-weight="700" fill="#0b1020" letter-spacing="3">KRONOSMEDICINE · DERMATOLOGÍA</text>
<text x="50" y="128" font-size="52" font-weight="800" fill="#0b1020">Dermatología de un vistazo</text>
<text x="50" y="172" font-size="22" fill="#0b1020">20 temas · la perla ENARM de cada uno</text>
<rect x="50.0" y="260" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="260" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="302" r="20" fill="#4fd1c5"/><text x="94.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">1</text><text x="128.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Carcinoma basocelular</text><text x="78.0" y="354" font-size="18" fill="#b8c2e6">Pápula perlada con telangiectasias en la</text><text x="78.0" y="380" font-size="18" fill="#b8c2e6">nariz: carcinoma basocelular nodular.</text><rect x="552.0" y="260" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="260" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="302" r="20" fill="#7c8cff"/><text x="596.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">2</text><text x="630.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Carcinoma espinocelular</text><text x="580.0" y="354" font-size="18" fill="#b8c2e6">Úlcera crónica o cicatriz de quemadura que</text><text x="580.0" y="380" font-size="18" fill="#b8c2e6">cambia o no cicatriza: biopsia para descartar</text><text x="580.0" y="406" font-size="18" fill="#b8c2e6">úlcera de Marjolin.</text><rect x="50.0" y="454" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="454" width="8" height="170" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="496" r="20" fill="#f6ad55"/><text x="94.0" y="503" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">3</text><text x="128.0" y="504" font-size="23" font-weight="800" fill="#e8ecf8">Melanoma</text><text x="78.0" y="548" font-size="18" fill="#b8c2e6">Factor pronóstico más importante del melanoma</text><text x="78.0" y="574" font-size="18" fill="#b8c2e6">localizado: índice de Breslow.</text><rect x="552.0" y="480" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="480" width="8" height="196" rx="4" fill="#f687b3"/><circle cx="596.0" cy="522" r="20" fill="#f687b3"/><text x="596.0" y="529" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">4</text><text x="630.0" y="530" font-size="23" font-weight="800" fill="#e8ecf8">Toxicodermias</text><text x="580.0" y="574" font-size="18" fill="#b8c2e6">Lo más importante en Stevens-Johnson/NET es</text><text x="580.0" y="600" font-size="18" fill="#b8c2e6">suspender el fármaco sospechoso lo antes</text><text x="580.0" y="626" font-size="18" fill="#b8c2e6">posible.</text><rect x="50.0" y="648" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="648" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="690" r="20" fill="#63b3ed"/><text x="94.0" y="697" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">5</text><text x="128.0" y="698" font-size="23" font-weight="800" fill="#e8ecf8">Pénfigos y penfigoide</text><text x="78.0" y="742" font-size="18" fill="#b8c2e6">Pénfigo: ampollas flácidas, mucosas y Nikolsky</text><text x="78.0" y="768" font-size="18" fill="#b8c2e6">+. Penfigoide: ampollas tensas, ancianos,</text><text x="78.0" y="794" font-size="18" fill="#b8c2e6">Nikolsky −.</text><rect x="552.0" y="700" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="700" width="8" height="170" rx="4" fill="#b794f4"/><circle cx="596.0" cy="742" r="20" fill="#b794f4"/><text x="596.0" y="749" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">6</text><text x="630.0" y="750" font-size="23" font-weight="800" fill="#e8ecf8">Acné</text><text x="580.0" y="794" font-size="18" fill="#b8c2e6">Isotretinoína: teratogénica; exige prueba de</text><text x="580.0" y="820" font-size="18" fill="#b8c2e6">embarazo y doble anticoncepción.</text><rect x="50.0" y="868" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="868" width="8" height="170" rx="4" fill="#68d391"/><circle cx="94.0" cy="910" r="20" fill="#68d391"/><text x="94.0" y="917" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">7</text><text x="128.0" y="918" font-size="23" font-weight="800" fill="#e8ecf8">Rosácea</text><text x="78.0" y="962" font-size="18" fill="#b8c2e6">Pápulas y pústulas faciales SIN comedones en</text><text x="78.0" y="988" font-size="18" fill="#b8c2e6">un adulto con rubor: rosácea, no acné.</text><rect x="552.0" y="894" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="894" width="8" height="196" rx="4" fill="#4fd1c5"/><circle cx="596.0" cy="936" r="20" fill="#4fd1c5"/><text x="596.0" y="943" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">8</text><text x="630.0" y="944" font-size="23" font-weight="800" fill="#e8ecf8">Dermatitis atópica</text><text x="580.0" y="988" font-size="18" fill="#b8c2e6">Los emolientes diarios son la base del</text><text x="580.0" y="1014" font-size="18" fill="#b8c2e6">tratamiento de la dermatitis atópica, incluso</text><text x="580.0" y="1040" font-size="18" fill="#b8c2e6">sin brote.</text><rect x="50.0" y="1062" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1062" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="94.0" cy="1104" r="20" fill="#7c8cff"/><text x="94.0" y="1111" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">9</text><text x="128.0" y="1112" font-size="23" font-weight="800" fill="#e8ecf8">Dermatitis por contacto</text><text x="78.0" y="1156" font-size="18" fill="#b8c2e6">Dermatitis por contacto alérgica = tipo IV; se</text><text x="78.0" y="1182" font-size="18" fill="#b8c2e6">confirma con prueba del parche (no con prick</text><text x="78.0" y="1208" font-size="18" fill="#b8c2e6">test).</text><rect x="552.0" y="1114" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="1114" width="8" height="170" rx="4" fill="#f6ad55"/><circle cx="596.0" cy="1156" r="20" fill="#f6ad55"/><text x="596.0" y="1163" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">10</text><text x="630.0" y="1164" font-size="23" font-weight="800" fill="#e8ecf8">Piodermitis</text><text x="580.0" y="1208" font-size="18" fill="#b8c2e6">Erisipela: bordes bien delimitados y elevados</text><text x="580.0" y="1234" font-size="18" fill="#b8c2e6">(estreptococo). Celulitis: bordes difusos.</text><rect x="50.0" y="1282" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="1282" width="8" height="170" rx="4" fill="#f687b3"/><circle cx="94.0" cy="1324" r="20" fill="#f687b3"/><text x="94.0" y="1331" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">11</text><text x="128.0" y="1332" font-size="23" font-weight="800" fill="#e8ecf8">Lepra</text><text x="78.0" y="1376" font-size="18" fill="#b8c2e6">Mancha hipocrómica anestésica con nervio</text><text x="78.0" y="1402" font-size="18" fill="#b8c2e6">periférico engrosado: piensa en lepra.</text><rect x="552.0" y="1308" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1308" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="596.0" cy="1350" r="20" fill="#63b3ed"/><text x="596.0" y="1357" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">12</text><text x="630.0" y="1358" font-size="23" font-weight="800" fill="#e8ecf8">Escabiosis</text><text x="580.0" y="1402" font-size="18" fill="#b8c2e6">Prurito nocturno en varios miembros de la</text><text x="580.0" y="1428" font-size="18" fill="#b8c2e6">familia: escabiosis. Se trata a todos los</text><text x="580.0" y="1454" font-size="18" fill="#b8c2e6">convivientes a la vez.</text><rect x="50.0" y="1476" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="1476" width="8" height="170" rx="4" fill="#b794f4"/><circle cx="94.0" cy="1518" r="20" fill="#b794f4"/><text x="94.0" y="1525" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">13</text><text x="128.0" y="1526" font-size="23" font-weight="800" fill="#e8ecf8">Tiñas (dermatofitosis)</text><text x="78.0" y="1570" font-size="18" fill="#b8c2e6">Tiña de la cabeza y onicomicosis requieren</text><text x="78.0" y="1596" font-size="18" fill="#b8c2e6">tratamiento oral; el tópico no basta.</text><rect x="552.0" y="1528" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="1528" width="8" height="170" rx="4" fill="#68d391"/><circle cx="596.0" cy="1570" r="20" fill="#68d391"/><text x="596.0" y="1577" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">14</text><text x="630.0" y="1578" font-size="23" font-weight="800" fill="#e8ecf8">Pitiriasis versicolor</text><text x="580.0" y="1622" font-size="18" fill="#b8c2e6">KOH en &#x27;espagueti con albóndigas&#x27; = Malassezia</text><text x="580.0" y="1648" font-size="18" fill="#b8c2e6">(pitiriasis versicolor).</text><rect x="50.0" y="1670" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="1670" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="1712" r="20" fill="#4fd1c5"/><text x="94.0" y="1719" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">15</text><text x="128.0" y="1720" font-size="23" font-weight="800" fill="#e8ecf8">Dermatitis seborreica</text><text x="78.0" y="1764" font-size="18" fill="#b8c2e6">Dermatitis seborreica extensa y refractaria en</text><text x="78.0" y="1790" font-size="18" fill="#b8c2e6">un adulto joven: solicita prueba de VIH.</text><rect x="552.0" y="1722" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1722" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="1764" r="20" fill="#7c8cff"/><text x="596.0" y="1771" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">16</text><text x="630.0" y="1772" font-size="23" font-weight="800" fill="#e8ecf8">Pitiriasis rosada de Gibert</text><text x="580.0" y="1816" font-size="18" fill="#b8c2e6">Placa heráldica seguida de lesiones en árbol</text><text x="580.0" y="1842" font-size="18" fill="#b8c2e6">de Navidad: pitiriasis rosada. Si hay palmas y</text><text x="580.0" y="1868" font-size="18" fill="#b8c2e6">plantas, VDRL.</text><rect x="50.0" y="1864" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1864" width="8" height="196" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="1906" r="20" fill="#f6ad55"/><text x="94.0" y="1913" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">17</text><text x="128.0" y="1914" font-size="23" font-weight="800" fill="#e8ecf8">Queratosis actínica</text><text x="78.0" y="1958" font-size="18" fill="#b8c2e6">Queratosis actínica = lesión premaligna del</text><text x="78.0" y="1984" font-size="18" fill="#b8c2e6">espinocelular; se trata y se indica</text><text x="78.0" y="2010" font-size="18" fill="#b8c2e6">fotoprotección.</text><rect x="552.0" y="1942" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1942" width="8" height="196" rx="4" fill="#f687b3"/><circle cx="596.0" cy="1984" r="20" fill="#f687b3"/><text x="596.0" y="1991" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">18</text><text x="630.0" y="1992" font-size="23" font-weight="800" fill="#e8ecf8">Nevos displásicos</text><text x="580.0" y="2036" font-size="18" fill="#b8c2e6">Los nevos displásicos son marcadores de</text><text x="580.0" y="2062" font-size="18" fill="#b8c2e6">riesgo: vigila al paciente de por vida, no</text><text x="580.0" y="2088" font-size="18" fill="#b8c2e6">extirpes todos los lunares.</text><rect x="50.0" y="2084" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="2084" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="2126" r="20" fill="#63b3ed"/><text x="94.0" y="2133" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">19</text><text x="128.0" y="2134" font-size="23" font-weight="800" fill="#e8ecf8">Psoriasis</text><text x="78.0" y="2178" font-size="18" fill="#b8c2e6">No uses esteroides sistémicos en psoriasis: al</text><text x="78.0" y="2204" font-size="18" fill="#b8c2e6">retirarlos puede aparecer psoriasis pustulosa</text><text x="78.0" y="2230" font-size="18" fill="#b8c2e6">generalizada.</text><rect x="552.0" y="2162" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="2162" width="8" height="196" rx="4" fill="#b794f4"/><circle cx="596.0" cy="2204" r="20" fill="#b794f4"/><text x="596.0" y="2211" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">20</text><text x="630.0" y="2212" font-size="23" font-weight="800" fill="#e8ecf8">Liquen plano</text><text x="580.0" y="2256" font-size="18" fill="#b8c2e6">Pápulas violáceas poligonales pruriginosas con</text><text x="580.0" y="2282" font-size="18" fill="#b8c2e6">estrías de Wickham: liquen plano; pide</text><text x="580.0" y="2308" font-size="18" fill="#b8c2e6">serología de hepatitis C.</text>
<text x="540.0" y="2420" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo de KronosMedicine · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>