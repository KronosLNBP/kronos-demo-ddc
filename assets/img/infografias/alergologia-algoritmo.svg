<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1252" width="1200" height="1252" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4c7"/></marker></defs>
<rect width="1200" height="1252" fill="#0b1020"/>
<text x="600.0" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#e8ecf8">Anafilaxia: manejo inicial</text>
<text x="600.0" y="100" text-anchor="middle" font-size="18" fill="#9aa4c7">Diagrama de flujo · Alergología · KronosMedicine</text>
<path d="M400.0,244 V294" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,392 V442" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,540 V590" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,714 V764" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="742" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><path d="M400.0,862 V912" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,1010 V1060" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><rect x="120" y="150" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="190.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Sospecha: inicio súbito de piel o mucosas +</text><text x="400.0" y="220.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">compromiso respiratorio o cardiovascular</text><rect x="120" y="298" width="560" height="94" rx="16" fill="#4fd1c5" stroke="none" stroke-width="2.5"/><text x="400.0" y="338.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">Adrenalina IM en el muslo: 0.01 mg/kg (máx.</text><text x="400.0" y="368.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">0.5 mg adulto, 0.3 mg niño)</text><rect x="120" y="446" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="486.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Retirar el alérgeno · posición supina con</text><text x="400.0" y="516.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">piernas elevadas · oxígeno · líquidos IV</text><polygon points="400.0,594 680,654.0 400.0,714 120,654.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="662.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Mejora en 5–15 minutos?</text><path d="M680,654.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="644.0" font-size="18" font-weight="700" fill="#9aa4c7">No</text><rect x="770" y="597.0" width="420" height="114" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="635.0" text-anchor="middle" font-size="19" fill="#e8ecf8">repetir adrenalina IM, más</text><text x="980" y="663.0" text-anchor="middle" font-size="19" fill="#e8ecf8">líquidos; si persiste,</text><text x="980" y="691.0" text-anchor="middle" font-size="19" fill="#e8ecf8">infusión IV en UCI</text><rect x="120" y="768" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="808.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Segunda línea: antihistamínico H1, salbutamol</text><text x="400.0" y="838.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">si hay sibilancias, esteroide</text><rect x="120" y="916" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="956.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Observar 6–12 h (reacción bifásica) · triptasa</text><text x="400.0" y="986.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">sérica</text><rect x="120" y="1064" width="560" height="94" rx="16" fill="#141b33" stroke="#48bb78" stroke-width="2.5"/><text x="400.0" y="1104.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Alta: autoinyector de adrenalina, plan</text><text x="400.0" y="1134.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">escrito, brazalete y envío a Alergología</text>
<text x="600.0" y="1238" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>