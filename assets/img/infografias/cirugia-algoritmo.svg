<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1422" width="1200" height="1422" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4c7"/></marker></defs>
<rect width="1200" height="1422" fill="#0b1020"/>
<text x="600.0" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#e8ecf8">Enfermedad litiásica biliar</text>
<text x="600.0" y="100" text-anchor="middle" font-size="18" fill="#9aa4c7">Diagrama de flujo · Cirugía General · KronosMedicine</text>
<path d="M400.0,214 V264" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,332 V382" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,506 V556" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="534" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><path d="M400.0,654 V704" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,828 V878" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="856" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><path d="M400.0,976 V1026" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,1150 V1200" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="1178" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><rect x="120" y="150" width="560" height="64" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="190.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Dolor en hipocondrio derecho o epigastrio</text><rect x="120" y="268" width="560" height="64" rx="16" fill="#4fd1c5" stroke="none" stroke-width="2.5"/><text x="400.0" y="308.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">Ultrasonido de hígado y vías biliares</text><polygon points="400.0,386 680,446.0 400.0,506 120,446.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="439.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Fiebre, Murphy positivo,</text><text x="400.0" y="469.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">pared &gt; 4 mm?</text><path d="M680,446.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="436.0" font-size="18" font-weight="700" fill="#9aa4c7">No</text><rect x="770" y="389.0" width="420" height="114" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="427.0" text-anchor="middle" font-size="19" fill="#e8ecf8">No y dolor &lt; 6 h: cólico</text><text x="980" y="455.0" text-anchor="middle" font-size="19" fill="#e8ecf8">biliar → colecistectomía</text><text x="980" y="483.0" text-anchor="middle" font-size="19" fill="#e8ecf8">laparoscópica electiva</text><rect x="120" y="560" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="600.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Colecistitis aguda: ayuno, líquidos,</text><text x="400.0" y="630.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">antibiótico</text><polygon points="400.0,708 680,768.0 400.0,828 120,768.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="776.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Ictericia o colédoco &gt; 6 mm?</text><path d="M680,768.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="758.0" font-size="18" font-weight="700" fill="#9aa4c7">No</text><rect x="770" y="711.0" width="420" height="114" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="749.0" text-anchor="middle" font-size="19" fill="#e8ecf8">colecistectomía</text><text x="980" y="777.0" text-anchor="middle" font-size="19" fill="#e8ecf8">laparoscópica temprana (&lt; 72</text><text x="980" y="805.0" text-anchor="middle" font-size="19" fill="#e8ecf8">h)</text><rect x="120" y="882" width="560" height="94" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="922.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Coledocolitiasis: CPRE con extracción y</text><text x="400.0" y="952.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">después colecistectomía</text><polygon points="400.0,1030 680,1090.0 400.0,1150 120,1090.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="1083.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Fiebre + ictericia + dolor</text><text x="400.0" y="1113.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">(Charcot)?</text><path d="M680,1090.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="1080.0" font-size="18" font-weight="700" fill="#9aa4c7">No</text><rect x="770" y="1047.0" width="420" height="86" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="1085.0" text-anchor="middle" font-size="19" fill="#e8ecf8">completar CPRE y</text><text x="980" y="1113.0" text-anchor="middle" font-size="19" fill="#e8ecf8">colecistectomía</text><rect x="120" y="1204" width="560" height="124" rx="16" fill="#141b33" stroke="#48bb78" stroke-width="2.5"/><text x="400.0" y="1244.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Colangitis: antibiótico y drenaje biliar;</text><text x="400.0" y="1274.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">urgente si hay hipotensión o confusión</text><text x="400.0" y="1304.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">(Reynolds)</text>
<text x="600.0" y="1408" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>