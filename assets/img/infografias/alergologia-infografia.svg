<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 786" width="1080" height="786" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient></defs>
<rect width="1080" height="786" fill="#0b1020"/>
<rect width="1080" height="200" fill="url(#hdr)"/>
<text x="50" y="62" font-size="20" font-weight="700" fill="#0b1020" letter-spacing="3">KRONOSMEDICINE · ALERGOLOGÍA E INMUNOLOGÍA</text>
<text x="50" y="128" font-size="52" font-weight="800" fill="#0b1020">Alergología de un vistazo</text>
<text x="50" y="172" font-size="22" fill="#0b1020">4 temas · la perla ENARM de cada uno</text>
<rect x="50.0" y="260" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="260" width="8" height="196" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="302" r="20" fill="#4fd1c5"/><text x="94.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">1</text><text x="128.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Reacciones de hipersensibilidad</text><text x="78.0" y="354" font-size="18" fill="#b8c2e6">Mantoux positivo: ≥ 10 mm en general y ≥ 5 mm</text><text x="78.0" y="380" font-size="18" fill="#b8c2e6">en VIH o inmunosupresión. Se lee a las 48–72 h</text><text x="78.0" y="406" font-size="18" fill="#b8c2e6">porque es tipo IV.</text><rect x="552.0" y="260" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="260" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="302" r="20" fill="#7c8cff"/><text x="596.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">2</text><text x="630.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Rinitis alérgica</text><text x="580.0" y="354" font-size="18" fill="#b8c2e6">No usar descongestionantes nasales</text><text x="580.0" y="380" font-size="18" fill="#b8c2e6">(oximetazolina) más de 3–5 días: causan</text><text x="580.0" y="406" font-size="18" fill="#b8c2e6">rinitis medicamentosa por efecto rebote.</text><rect x="50.0" y="480" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="480" width="8" height="196" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="522" r="20" fill="#f6ad55"/><text x="94.0" y="529" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">3</text><text x="128.0" y="530" font-size="23" font-weight="800" fill="#e8ecf8">Urticaria y angioedema</text><text x="78.0" y="574" font-size="18" fill="#b8c2e6">Roncha que dura más de 24 h y deja mancha:</text><text x="78.0" y="600" font-size="18" fill="#b8c2e6">urticaria vasculítica hasta demostrar lo</text><text x="78.0" y="626" font-size="18" fill="#b8c2e6">contrario; pide biopsia.</text><rect x="552.0" y="480" width="478.0" height="222" rx="18" fill="#141b33"/><rect x="552.0" y="480" width="8" height="222" rx="4" fill="#f687b3"/><circle cx="596.0" cy="522" r="20" fill="#f687b3"/><text x="596.0" y="529" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">4</text><text x="630.0" y="530" font-size="23" font-weight="800" fill="#e8ecf8">Choque anafiláctico</text><text x="580.0" y="574" font-size="18" fill="#b8c2e6">La adrenalina IM en el muslo es el tratamiento</text><text x="580.0" y="600" font-size="18" fill="#b8c2e6">de elección y no tiene contraindicación</text><text x="580.0" y="626" font-size="18" fill="#b8c2e6">absoluta en la anafilaxia. El antihistamínico</text><text x="580.0" y="652" font-size="18" fill="#b8c2e6">nunca la reemplaza.</text>
<text x="540.0" y="764" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo de KronosMedicine · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>