<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1336" width="1200" height="1336" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4c7"/></marker></defs>
<rect width="1200" height="1336" fill="#0b1020"/>
<text x="600.0" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#e8ecf8">Dolor torácico y sospecha de SICA</text>
<text x="600.0" y="100" text-anchor="middle" font-size="18" fill="#9aa4c7">Diagrama de flujo · Cardiología · KronosMedicine</text>
<path d="M400.0,214 V264" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,332 V382" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,506 V556" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="534" font-size="18" font-weight="700" fill="#9aa4c7">No</text><path d="M400.0,624 V674" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,798 V848" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="414.0" y="826" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><path d="M400.0,916 V966" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M400.0,1064 V1114" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><rect x="120" y="150" width="560" height="64" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="190.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Dolor torácico sugestivo de isquemia</text><rect x="120" y="268" width="560" height="64" rx="16" fill="#4fd1c5" stroke="none" stroke-width="2.5"/><text x="400.0" y="308.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">ECG de 12 derivaciones en menos de 10 minutos</text><polygon points="400.0,386 680,446.0 400.0,506 120,446.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="439.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Elevación del ST o BRIHH</text><text x="400.0" y="469.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">nuevo?</text><path d="M680,446.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="436.0" font-size="18" font-weight="700" fill="#9aa4c7">Sí</text><rect x="770" y="375.0" width="420" height="142" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="413.0" text-anchor="middle" font-size="19" fill="#e8ecf8">SICA CEST → angioplastia</text><text x="980" y="441.0" text-anchor="middle" font-size="19" fill="#e8ecf8">primaria si es posible en &lt;</text><text x="980" y="469.0" text-anchor="middle" font-size="19" fill="#e8ecf8">120 min; si no, trombólisis (&lt;</text><text x="980" y="497.0" text-anchor="middle" font-size="19" fill="#e8ecf8">12 h de síntomas)</text><rect x="120" y="560" width="560" height="64" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="600.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Troponina ultrasensible a las 0 y 1–3 h</text><polygon points="400.0,678 680,738.0 400.0,798 120,738.0" fill="#1c2547" stroke="#7c8cff" stroke-width="2.5"/><text x="400.0" y="746.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">¿Troponina elevada?</text><path d="M680,738.0 H770" stroke="#9aa4c7" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><text x="702" y="728.0" font-size="18" font-weight="700" fill="#9aa4c7">No</text><rect x="770" y="695.0" width="420" height="86" rx="14" fill="#141b33" stroke="#f6ad55" stroke-width="2"/><text x="980" y="733.0" text-anchor="middle" font-size="19" fill="#e8ecf8">angina inestable (si la</text><text x="980" y="761.0" text-anchor="middle" font-size="19" fill="#e8ecf8">clínica es de isquemia)</text><rect x="120" y="852" width="560" height="64" rx="16" fill="#141b33" stroke="#2a3563" stroke-width="2.5"/><text x="400.0" y="892.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">IAM sin elevación del ST</text><rect x="120" y="970" width="560" height="94" rx="16" fill="#4fd1c5" stroke="none" stroke-width="2.5"/><text x="400.0" y="1010.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">Aspirina + inhibidor P2Y12 + anticoagulante +</text><text x="400.0" y="1040.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1020">estatina de alta intensidad</text><rect x="120" y="1118" width="560" height="124" rx="16" fill="#141b33" stroke="#48bb78" stroke-width="2.5"/><text x="400.0" y="1158.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">Estratificar (GRACE): coronariografía</text><text x="400.0" y="1188.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">inmediata (&lt; 2 h) si inestable; temprana (&lt; 24</text><text x="400.0" y="1218.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e8ecf8">h) si alto riesgo</text>
<text x="600.0" y="1322" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>