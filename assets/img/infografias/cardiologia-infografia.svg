<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2554" width="1080" height="2554" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient></defs>
<rect width="1080" height="2554" fill="#0b1020"/>
<rect width="1080" height="200" fill="url(#hdr)"/>
<text x="50" y="62" font-size="20" font-weight="700" fill="#0b1020" letter-spacing="3">KRONOSMEDICINE · CARDIOLOGÍA</text>
<text x="50" y="128" font-size="52" font-weight="800" fill="#0b1020">Cardiología de un vistazo</text>
<text x="50" y="172" font-size="22" fill="#0b1020">20 temas · la perla ENARM de cada uno</text>
<rect x="50.0" y="260" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="260" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="302" r="20" fill="#4fd1c5"/><text x="94.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">1</text><text x="128.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Hipertensión arterial sistémica</text><text x="78.0" y="354" font-size="18" fill="#b8c2e6">Nunca combines IECA con ARA II. En el</text><text x="78.0" y="380" font-size="18" fill="#b8c2e6">embarazo, IECA y ARA II están contraindicados.</text><rect x="552.0" y="260" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="260" width="8" height="170" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="302" r="20" fill="#7c8cff"/><text x="596.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">2</text><text x="630.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Crisis hipertensiva</text><text x="580.0" y="354" font-size="18" fill="#b8c2e6">Lo que define la emergencia es el daño agudo a</text><text x="580.0" y="380" font-size="18" fill="#b8c2e6">órgano blanco, no la cifra de TA.</text><rect x="50.0" y="454" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="454" width="8" height="196" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="496" r="20" fill="#f6ad55"/><text x="94.0" y="503" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">3</text><text x="128.0" y="504" font-size="23" font-weight="800" fill="#e8ecf8">Angina de pecho</text><text x="78.0" y="548" font-size="18" fill="#b8c2e6">Angina que aparece en reposo, de reciente</text><text x="78.0" y="574" font-size="18" fill="#b8c2e6">inicio o en aumento ya no es estable: es un</text><text x="78.0" y="600" font-size="18" fill="#b8c2e6">SICA (angina inestable).</text><rect x="552.0" y="454" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="454" width="8" height="196" rx="4" fill="#f687b3"/><circle cx="596.0" cy="496" r="20" fill="#f687b3"/><text x="596.0" y="503" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">4</text><text x="630.0" y="504" font-size="23" font-weight="800" fill="#e8ecf8">SICA sin elevación del ST</text><text x="580.0" y="548" font-size="18" fill="#b8c2e6">La trombólisis solo se usa en el SICA CON</text><text x="580.0" y="574" font-size="18" fill="#b8c2e6">elevación del ST. En el SEST está</text><text x="580.0" y="600" font-size="18" fill="#b8c2e6">contraindicada.</text><rect x="50.0" y="674" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="674" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="716" r="20" fill="#63b3ed"/><text x="94.0" y="723" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">5</text><text x="128.0" y="724" font-size="23" font-weight="800" fill="#e8ecf8">SICA con elevación del ST</text><text x="78.0" y="768" font-size="18" fill="#b8c2e6">IAM inferior con hipotensión: piensa en</text><text x="78.0" y="794" font-size="18" fill="#b8c2e6">infarto del VD; da volumen y evita nitratos y</text><text x="78.0" y="820" font-size="18" fill="#b8c2e6">diuréticos.</text><rect x="552.0" y="674" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="674" width="8" height="196" rx="4" fill="#b794f4"/><circle cx="596.0" cy="716" r="20" fill="#b794f4"/><text x="596.0" y="723" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">6</text><text x="630.0" y="724" font-size="23" font-weight="800" fill="#e8ecf8">Riesgo cardiovascular</text><text x="580.0" y="768" font-size="18" fill="#b8c2e6">El tabaquismo es el factor de riesgo</text><text x="580.0" y="794" font-size="18" fill="#b8c2e6">modificable cuyo abandono reduce más rápido el</text><text x="580.0" y="820" font-size="18" fill="#b8c2e6">riesgo cardiovascular.</text><rect x="50.0" y="894" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="894" width="8" height="196" rx="4" fill="#68d391"/><circle cx="94.0" cy="936" r="20" fill="#68d391"/><text x="94.0" y="943" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">7</text><text x="128.0" y="944" font-size="23" font-weight="800" fill="#e8ecf8">Cardiopatía isquémica crónica</text><text x="78.0" y="988" font-size="18" fill="#b8c2e6">Diabético con enfermedad de 3 vasos o del</text><text x="78.0" y="1014" font-size="18" fill="#b8c2e6">tronco: la cirugía de revascularización supera</text><text x="78.0" y="1040" font-size="18" fill="#b8c2e6">a la angioplastia.</text><rect x="552.0" y="894" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="894" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="596.0" cy="936" r="20" fill="#4fd1c5"/><text x="596.0" y="943" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">8</text><text x="630.0" y="944" font-size="23" font-weight="800" fill="#e8ecf8">Insuficiencia cardiaca crónica</text><text x="580.0" y="988" font-size="18" fill="#b8c2e6">Los diuréticos de asa mejoran síntomas pero no</text><text x="580.0" y="1014" font-size="18" fill="#b8c2e6">reducen mortalidad; los 4 pilares sí.</text><rect x="552.0" y="1088" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="1088" width="8" height="170" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="1130" r="20" fill="#7c8cff"/><text x="596.0" y="1137" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">9</text><text x="630.0" y="1138" font-size="23" font-weight="800" fill="#e8ecf8">Insuficiencia cardiaca aguda</text><text x="580.0" y="1182" font-size="18" fill="#b8c2e6">En la IC aguda no suspendas el betabloqueador</text><text x="580.0" y="1208" font-size="18" fill="#b8c2e6">de base salvo choque o bajo gasto grave.</text><rect x="50.0" y="1114" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1114" width="8" height="196" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="1156" r="20" fill="#f6ad55"/><text x="94.0" y="1163" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">10</text><text x="128.0" y="1164" font-size="23" font-weight="800" fill="#e8ecf8">Fibrilación auricular</text><text x="78.0" y="1208" font-size="18" fill="#b8c2e6">FA con válvula mecánica o estenosis mitral</text><text x="78.0" y="1234" font-size="18" fill="#b8c2e6">moderada-grave: anticoagular con warfarina, no</text><text x="78.0" y="1260" font-size="18" fill="#b8c2e6">con anticoagulantes directos.</text><rect x="552.0" y="1282" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1282" width="8" height="196" rx="4" fill="#f687b3"/><circle cx="596.0" cy="1324" r="20" fill="#f687b3"/><text x="596.0" y="1331" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">11</text><text x="630.0" y="1332" font-size="23" font-weight="800" fill="#e8ecf8">Taquicardia supraventricular</text><text x="580.0" y="1376" font-size="18" fill="#b8c2e6">Adenosina: bolo IV rápido seguido de bolo de</text><text x="580.0" y="1402" font-size="18" fill="#b8c2e6">solución; produce una pausa breve que es</text><text x="580.0" y="1428" font-size="18" fill="#b8c2e6">esperada.</text><rect x="50.0" y="1334" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1334" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="1376" r="20" fill="#63b3ed"/><text x="94.0" y="1383" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">12</text><text x="128.0" y="1384" font-size="23" font-weight="800" fill="#e8ecf8">Bloqueo auriculoventricular</text><text x="78.0" y="1428" font-size="18" fill="#b8c2e6">Mobitz II y bloqueo AV completo requieren</text><text x="78.0" y="1454" font-size="18" fill="#b8c2e6">marcapasos definitivo; Mobitz I asintomático</text><text x="78.0" y="1480" font-size="18" fill="#b8c2e6">no.</text><rect x="552.0" y="1502" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1502" width="8" height="196" rx="4" fill="#b794f4"/><circle cx="596.0" cy="1544" r="20" fill="#b794f4"/><text x="596.0" y="1551" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">13</text><text x="630.0" y="1552" font-size="23" font-weight="800" fill="#e8ecf8">Síndrome de Wolff-Parkinson-White</text><text x="580.0" y="1596" font-size="18" fill="#b8c2e6">FA con QRS ancho e irregular en un joven:</text><text x="580.0" y="1622" font-size="18" fill="#b8c2e6">piensa en WPW y no des bloqueadores del nodo</text><text x="580.0" y="1648" font-size="18" fill="#b8c2e6">AV.</text><rect x="50.0" y="1554" width="478.0" height="248" rx="18" fill="#141b33"/><rect x="50.0" y="1554" width="8" height="248" rx="4" fill="#68d391"/><circle cx="94.0" cy="1596" r="20" fill="#68d391"/><text x="94.0" y="1603" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">14</text><text x="128.0" y="1604" font-size="23" font-weight="800" fill="#e8ecf8">Endocarditis infecciosa</text><text x="78.0" y="1648" font-size="18" fill="#b8c2e6">Profilaxis antibiótica solo en procedimientos</text><text x="78.0" y="1674" font-size="18" fill="#b8c2e6">dentales de riesgo en pacientes de alto</text><text x="78.0" y="1700" font-size="18" fill="#b8c2e6">riesgo: prótesis valvular, endocarditis previa</text><text x="78.0" y="1726" font-size="18" fill="#b8c2e6">y algunas cardiopatías congénitas. Amoxicilina</text><text x="78.0" y="1752" font-size="18" fill="#b8c2e6">2 g VO.</text><rect x="552.0" y="1722" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1722" width="8" height="196" rx="4" fill="#4fd1c5"/><circle cx="596.0" cy="1764" r="20" fill="#4fd1c5"/><text x="596.0" y="1771" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">15</text><text x="630.0" y="1772" font-size="23" font-weight="800" fill="#e8ecf8">Pericarditis y derrame pericárdico</text><text x="580.0" y="1816" font-size="18" fill="#b8c2e6">Elevación difusa del ST + depresión del PR que</text><text x="580.0" y="1842" font-size="18" fill="#b8c2e6">mejora al sentarse inclinado: pericarditis, no</text><text x="580.0" y="1868" font-size="18" fill="#b8c2e6">infarto.</text><rect x="50.0" y="1826" width="478.0" height="226" rx="18" fill="#141b33"/><rect x="50.0" y="1826" width="8" height="226" rx="4" fill="#7c8cff"/><circle cx="94.0" cy="1868" r="20" fill="#7c8cff"/><text x="94.0" y="1875" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">16</text><text x="128.0" y="1876" font-size="23" font-weight="800" fill="#e8ecf8">Válvula aórtica: estenosis e</text><text x="128.0" y="1906" font-size="23" font-weight="800" fill="#e8ecf8">insuficiencia</text><text x="78.0" y="1950" font-size="18" fill="#b8c2e6">Estenosis aórtica grave sintomática: el único</text><text x="78.0" y="1976" font-size="18" fill="#b8c2e6">tratamiento eficaz es el reemplazo valvular;</text><text x="78.0" y="2002" font-size="18" fill="#b8c2e6">los fármacos no cambian el pronóstico.</text><rect x="552.0" y="1942" width="478.0" height="226" rx="18" fill="#141b33"/><rect x="552.0" y="1942" width="8" height="226" rx="4" fill="#f6ad55"/><circle cx="596.0" cy="1984" r="20" fill="#f6ad55"/><text x="596.0" y="1991" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">17</text><text x="630.0" y="1992" font-size="23" font-weight="800" fill="#e8ecf8">Válvula mitral: estenosis e</text><text x="630.0" y="2022" font-size="23" font-weight="800" fill="#e8ecf8">insuficiencia</text><text x="580.0" y="2066" font-size="18" fill="#b8c2e6">Soplo diastólico en retumbo con chasquido de</text><text x="580.0" y="2092" font-size="18" fill="#b8c2e6">apertura en una mujer joven: estenosis mitral</text><text x="580.0" y="2118" font-size="18" fill="#b8c2e6">reumática.</text><rect x="50.0" y="2076" width="478.0" height="200" rx="18" fill="#141b33"/><rect x="50.0" y="2076" width="8" height="200" rx="4" fill="#f687b3"/><circle cx="94.0" cy="2118" r="20" fill="#f687b3"/><text x="94.0" y="2125" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">18</text><text x="128.0" y="2126" font-size="23" font-weight="800" fill="#e8ecf8">Válvula tricúspide: estenosis e</text><text x="128.0" y="2156" font-size="23" font-weight="800" fill="#e8ecf8">insuficiencia</text><text x="78.0" y="2200" font-size="18" fill="#b8c2e6">Los soplos de cavidades derechas aumentan con</text><text x="78.0" y="2226" font-size="18" fill="#b8c2e6">la inspiración (Rivero-Carvallo).</text><rect x="552.0" y="2192" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="2192" width="8" height="196" rx="4" fill="#63b3ed"/><circle cx="596.0" cy="2234" r="20" fill="#63b3ed"/><text x="596.0" y="2241" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">19</text><text x="630.0" y="2242" font-size="23" font-weight="800" fill="#e8ecf8">Coartación de la aorta</text><text x="580.0" y="2286" font-size="18" fill="#b8c2e6">HTA en joven con pulsos femorales débiles:</text><text x="580.0" y="2312" font-size="18" fill="#b8c2e6">mide la TA en las 4 extremidades y busca</text><text x="580.0" y="2338" font-size="18" fill="#b8c2e6">coartación.</text><rect x="50.0" y="2300" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="2300" width="8" height="170" rx="4" fill="#b794f4"/><circle cx="94.0" cy="2342" r="20" fill="#b794f4"/><text x="94.0" y="2349" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">20</text><text x="128.0" y="2350" font-size="23" font-weight="800" fill="#e8ecf8">Disección aórtica</text><text x="78.0" y="2394" font-size="18" fill="#b8c2e6">Stanford A = cirugía urgente. Stanford B no</text><text x="78.0" y="2420" font-size="18" fill="#b8c2e6">complicada = tratamiento médico.</text>
<text x="540.0" y="2532" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo de KronosMedicine · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>