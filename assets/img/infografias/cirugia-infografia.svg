<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2036" width="1080" height="2036" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#4fd1c5"/></linearGradient></defs>
<rect width="1080" height="2036" fill="#0b1020"/>
<rect width="1080" height="200" fill="url(#hdr)"/>
<text x="50" y="62" font-size="20" font-weight="700" fill="#0b1020" letter-spacing="3">KRONOSMEDICINE · CIRUGÍA GENERAL</text>
<text x="50" y="128" font-size="52" font-weight="800" fill="#0b1020">Cirugía General de un vistazo</text>
<text x="50" y="172" font-size="22" fill="#0b1020">16 temas · la perla ENARM de cada uno</text>
<rect x="50.0" y="260" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="260" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="302" r="20" fill="#4fd1c5"/><text x="94.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">1</text><text x="128.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Oclusión intestinal</text><text x="78.0" y="354" font-size="18" fill="#b8c2e6">Oclusión en paciente sin cirugías previas:</text><text x="78.0" y="380" font-size="18" fill="#b8c2e6">busca una hernia encarcelada.</text><rect x="552.0" y="260" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="260" width="8" height="170" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="302" r="20" fill="#7c8cff"/><text x="596.0" y="309" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">2</text><text x="630.0" y="310" font-size="23" font-weight="800" fill="#e8ecf8">Colecistitis y colelitiasis</text><text x="580.0" y="354" font-size="18" fill="#b8c2e6">Colelitiasis asintomática no se opera, excepto</text><text x="580.0" y="380" font-size="18" fill="#b8c2e6">vesícula en porcelana o lito mayor de 3 cm.</text><rect x="50.0" y="454" width="478.0" height="226" rx="18" fill="#141b33"/><rect x="50.0" y="454" width="8" height="226" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="496" r="20" fill="#f6ad55"/><text x="94.0" y="503" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">3</text><text x="128.0" y="504" font-size="23" font-weight="800" fill="#e8ecf8">Complicaciones de la litiasis</text><text x="128.0" y="534" font-size="23" font-weight="800" fill="#e8ecf8">biliar</text><text x="78.0" y="578" font-size="18" fill="#b8c2e6">Charcot = fiebre + ictericia + dolor. Reynolds</text><text x="78.0" y="604" font-size="18" fill="#b8c2e6">= Charcot + hipotensión + confusión: drenaje</text><text x="78.0" y="630" font-size="18" fill="#b8c2e6">urgente.</text><rect x="552.0" y="454" width="478.0" height="226" rx="18" fill="#141b33"/><rect x="552.0" y="454" width="8" height="226" rx="4" fill="#f687b3"/><circle cx="596.0" cy="496" r="20" fill="#f687b3"/><text x="596.0" y="503" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">4</text><text x="630.0" y="504" font-size="23" font-weight="800" fill="#e8ecf8">Hernias: generalidades e</text><text x="630.0" y="534" font-size="23" font-weight="800" fill="#e8ecf8">inguinales</text><text x="580.0" y="578" font-size="18" fill="#b8c2e6">Indirecta: lateral a los vasos epigástricos</text><text x="580.0" y="604" font-size="18" fill="#b8c2e6">inferiores. Directa: medial (triángulo de</text><text x="580.0" y="630" font-size="18" fill="#b8c2e6">Hesselbach).</text><rect x="50.0" y="704" width="478.0" height="226" rx="18" fill="#141b33"/><rect x="50.0" y="704" width="8" height="226" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="746" r="20" fill="#63b3ed"/><text x="94.0" y="753" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">5</text><text x="128.0" y="754" font-size="23" font-weight="800" fill="#e8ecf8">Hernias ventrales, umbilical y</text><text x="128.0" y="784" font-size="23" font-weight="800" fill="#e8ecf8">especiales</text><text x="78.0" y="828" font-size="18" fill="#b8c2e6">Mujer anciana y delgada con oclusión y dolor</text><text x="78.0" y="854" font-size="18" fill="#b8c2e6">en la cara interna del muslo: hernia</text><text x="78.0" y="880" font-size="18" fill="#b8c2e6">obturatriz.</text><rect x="552.0" y="704" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="704" width="8" height="170" rx="4" fill="#b794f4"/><circle cx="596.0" cy="746" r="20" fill="#b794f4"/><text x="596.0" y="753" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">6</text><text x="630.0" y="754" font-size="23" font-weight="800" fill="#e8ecf8">Vólvulo de colon</text><text x="580.0" y="798" font-size="18" fill="#b8c2e6">Vólvulo de sigmoides: primero destorsión</text><text x="580.0" y="824" font-size="18" fill="#b8c2e6">endoscópica; vólvulo de ciego: cirugía.</text><rect x="552.0" y="898" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="898" width="8" height="170" rx="4" fill="#68d391"/><circle cx="596.0" cy="940" r="20" fill="#68d391"/><text x="596.0" y="947" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">7</text><text x="630.0" y="948" font-size="23" font-weight="800" fill="#e8ecf8">Apendicitis aguda</text><text x="580.0" y="992" font-size="18" fill="#b8c2e6">En niños y embarazadas el primer estudio de</text><text x="580.0" y="1018" font-size="18" fill="#b8c2e6">imagen es el ultrasonido; en adultos, la TC.</text><rect x="50.0" y="954" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="954" width="8" height="170" rx="4" fill="#4fd1c5"/><circle cx="94.0" cy="996" r="20" fill="#4fd1c5"/><text x="94.0" y="1003" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">8</text><text x="128.0" y="1004" font-size="23" font-weight="800" fill="#e8ecf8">Enfermedad diverticular</text><text x="78.0" y="1048" font-size="18" fill="#b8c2e6">Colonoscopia contraindicada en diverticulitis</text><text x="78.0" y="1074" font-size="18" fill="#b8c2e6">aguda; hacerla 6–8 semanas después.</text><rect x="552.0" y="1092" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1092" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="596.0" cy="1134" r="20" fill="#7c8cff"/><text x="596.0" y="1141" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">9</text><text x="630.0" y="1142" font-size="23" font-weight="800" fill="#e8ecf8">Enfermedad hemorroidal</text><text x="580.0" y="1186" font-size="18" fill="#b8c2e6">Todo sangrado rectal en mayores de 40–45 años</text><text x="580.0" y="1212" font-size="18" fill="#b8c2e6">obliga a descartar cáncer de colon, aunque</text><text x="580.0" y="1238" font-size="18" fill="#b8c2e6">haya hemorroides.</text><rect x="50.0" y="1148" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="1148" width="8" height="170" rx="4" fill="#f6ad55"/><circle cx="94.0" cy="1190" r="20" fill="#f6ad55"/><text x="94.0" y="1197" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">10</text><text x="128.0" y="1198" font-size="23" font-weight="800" fill="#e8ecf8">Fístula perianal</text><text x="78.0" y="1242" font-size="18" fill="#b8c2e6">Fístulas perianales múltiples o recurrentes:</text><text x="78.0" y="1268" font-size="18" fill="#b8c2e6">piensa en enfermedad de Crohn.</text><rect x="552.0" y="1312" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="1312" width="8" height="170" rx="4" fill="#f687b3"/><circle cx="596.0" cy="1354" r="20" fill="#f687b3"/><text x="596.0" y="1361" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">11</text><text x="630.0" y="1362" font-size="23" font-weight="800" fill="#e8ecf8">Absceso perianal</text><text x="580.0" y="1406" font-size="18" fill="#b8c2e6">El absceso perianal se drena; los antibióticos</text><text x="580.0" y="1432" font-size="18" fill="#b8c2e6">solos no son tratamiento.</text><rect x="50.0" y="1342" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="50.0" y="1342" width="8" height="170" rx="4" fill="#63b3ed"/><circle cx="94.0" cy="1384" r="20" fill="#63b3ed"/><text x="94.0" y="1391" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">12</text><text x="128.0" y="1392" font-size="23" font-weight="800" fill="#e8ecf8">Fisura anal</text><text x="78.0" y="1436" font-size="18" fill="#b8c2e6">Fisura fuera de la línea media: busca causa</text><text x="78.0" y="1462" font-size="18" fill="#b8c2e6">secundaria (Crohn, VIH, sífilis, cáncer).</text><rect x="552.0" y="1506" width="478.0" height="170" rx="18" fill="#141b33"/><rect x="552.0" y="1506" width="8" height="170" rx="4" fill="#b794f4"/><circle cx="596.0" cy="1548" r="20" fill="#b794f4"/><text x="596.0" y="1555" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">13</text><text x="630.0" y="1556" font-size="23" font-weight="800" fill="#e8ecf8">Úlceras por presión</text><text x="580.0" y="1600" font-size="18" fill="#b8c2e6">La mejor intervención es la prevención:</text><text x="580.0" y="1626" font-size="18" fill="#b8c2e6">cambios de posición cada 2 horas.</text><rect x="50.0" y="1536" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1536" width="8" height="196" rx="4" fill="#68d391"/><circle cx="94.0" cy="1578" r="20" fill="#68d391"/><text x="94.0" y="1585" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">14</text><text x="128.0" y="1586" font-size="23" font-weight="800" fill="#e8ecf8">Enfermedad arterial periférica</text><text x="78.0" y="1630" font-size="18" fill="#b8c2e6">Isquemia arterial aguda: heparina IV inmediata</text><text x="78.0" y="1656" font-size="18" fill="#b8c2e6">y revascularización urgente; las 6 P lo</text><text x="78.0" y="1682" font-size="18" fill="#b8c2e6">orientan.</text><rect x="552.0" y="1700" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="552.0" y="1700" width="8" height="196" rx="4" fill="#4fd1c5"/><circle cx="596.0" cy="1742" r="20" fill="#4fd1c5"/><text x="596.0" y="1749" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">15</text><text x="630.0" y="1750" font-size="23" font-weight="800" fill="#e8ecf8">Insuficiencia venosa crónica</text><text x="580.0" y="1794" font-size="18" fill="#b8c2e6">Antes de indicar compresión fuerte, descarta</text><text x="580.0" y="1820" font-size="18" fill="#b8c2e6">enfermedad arterial (ITB &lt; 0.6 la</text><text x="580.0" y="1846" font-size="18" fill="#b8c2e6">contraindica).</text><rect x="50.0" y="1756" width="478.0" height="196" rx="18" fill="#141b33"/><rect x="50.0" y="1756" width="8" height="196" rx="4" fill="#7c8cff"/><circle cx="94.0" cy="1798" r="20" fill="#7c8cff"/><text x="94.0" y="1805" text-anchor="middle" font-size="18" font-weight="800" fill="#0b1020">16</text><text x="128.0" y="1806" font-size="23" font-weight="800" fill="#e8ecf8">Quemaduras</text><text x="78.0" y="1850" font-size="18" fill="#b8c2e6">Parkland: 4 mL × kg × % SCQ; la mitad en las</text><text x="78.0" y="1876" font-size="18" fill="#b8c2e6">primeras 8 horas contadas desde la quemadura,</text><text x="78.0" y="1902" font-size="18" fill="#b8c2e6">no desde la llegada.</text>
<text x="540.0" y="2014" text-anchor="middle" font-size="14" fill="#5b648a">Material educativo de KronosMedicine · Revisar siempre la Guía de Práctica Clínica vigente</text>
</svg>